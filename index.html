<!DOCTYPE html>
<html lang="ru">
<head>

<title>Точка ИИ — работаем с интеллектом · Точка будущего</title>

<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#f2f2f2;
  --m2:#e6e6e6;
  --charcoal:#2f2d2c;
  --hero-acc:#4da3ff;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --text:#1d1d1f; --muted:#6f6f6f;
  --line:rgba(0,0,0,.10);
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --ok:#34c759; --err:#ff3b30;
  --radius:24px; --radius-s:16px; --shadow:0 12px 34px rgba(0,0,0,.10);
  --nav-h:64px;
  --pad:clamp(20px,4vw,48px);
  --wrap:1320px;
  --dock-h:64px;
  --zoom:1;
}
@media (min-width:1800px){:root{--zoom:1.25}}
@media (min-width:2300px){:root{--zoom:1.5}}
html{zoom:var(--zoom)}
@media (max-width:759px){:root{--dock-h:132px}}
[data-theme="dark"]{
  --bg:#161616; --m2:#1d1d1d; --charcoal:#232120;
  --hero-acc:#2997ff;
  --surface:#222222; --surface-2:#2a2a2a; --text:#f2f2f2; --muted:#9c9c9c;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --shadow:0 14px 40px rgba(0,0,0,.5);
}
.sec--m2{background:var(--m2)}

/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:clamp(26px,3.4vw,50px);font-weight:700}
h3{font-size:20px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.sec{padding:clamp(52px,7vw,110px) 0}
.sec-head{margin-bottom:clamp(26px,3vw,48px)}
.sec-head.center{text-align:center;max-width:860px;margin-inline:auto}
.sec-head.center .sec-lead{margin-inline:auto}
.sec-kicker{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-lead{color:var(--muted);margin-top:12px;max-width:720px;font-size:clamp(16px,1.5vw,20px)}
.j{text-align:justify;hyphens:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;
  border-radius:980px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;
  cursor:pointer;text-decoration:none;transition:transform .18s,opacity .18s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:color-mix(in srgb,var(--acc-p,var(--accent)) 14%,transparent);color:var(--acc-p,var(--accent))}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:980px;background:var(--surface);
  border:1px solid var(--line);font-size:14px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);
  background:color-mix(in srgb,var(--charcoal) 88%,transparent);backdrop-filter:saturate(140%) blur(18px);
  -webkit-backdrop-filter:saturate(140%) blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:var(--nav-h);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;text-decoration:none;color:#fff;min-height:44px}
.logo-img{height:32px;width:auto;flex:none}
.logo-img.hide{display:none}
.nav-links{display:none;gap:6px;margin-left:auto}
.nav-links a{color:rgba(255,255,255,.72);text-decoration:none;font-size:15px;font-weight:500;padding:10px 14px;border-radius:980px;min-height:44px;display:inline-flex;align-items:center;border-bottom:2px solid transparent}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.active{color:#fff;border-bottom-color:var(--hero-acc);border-radius:0}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s;flex:none}
.icon-btn:hover{transform:scale(1.06)}
.nav .icon-btn{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.burger{display:grid}
@media (min-width:960px){.nav-links{display:flex}.burger{display:none}}
.menu{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:49;background:var(--charcoal);border-bottom:1px solid rgba(255,255,255,.1);
  padding:12px var(--pad) 20px;display:grid;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.menu a{color:rgba(255,255,255,.85);text-decoration:none;font-size:18px;font-weight:600;padding:12px 14px;border-radius:14px;min-height:48px;display:flex;align-items:center}
.menu a:hover{background:rgba(255,255,255,.08);color:#fff}

/* ============ HERO: текст вверху слева, крупное изображение заходит под него ============ */
.hero{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;

.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn.line{background:transparent;color:var(--hero-acc);border:1.5px solid var(--hero-acc)}
.btn.line:hover{background:rgba(77,163,255,.14);opacity:1}

.btn.dim:hover{border-color:#fff;color:#fff;opacity:1}
.hero-scroll{display:inline-flex;align-items:center;gap:14px;margin-top:clamp(28px,4vw,52px);
  color:rgba(255,255,255,.65);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.hero-scroll i{display:block;width:44px;height:1.5px;background:rgba(255,255,255,.4)}
.hero-scroll .dn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--hero-acc);color:var(--hero-acc);
  display:grid;place-items:center;transition:transform .2s,background .2s}
.hero-scroll:hover .dn{transform:translateY(3px);background:rgba(77,163,255,.16)}
.hero-scroll:hover{color:#fff}
/* изображение 1536×1024 (3:2), прижато к правому нижнему углу hero */
.hero-photo{margin:0;position:relative;aspect-ratio:3/2;overflow:hidden}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:100% 100%;
  opacity:0;transition:opacity .8s}
.hero-photo.is-loaded img{opacity:1}
.hero-photo.is-missing img{display:none}
.photo-ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;color:var(--muted);background:var(--surface-2);border:1.5px dashed var(--line);border-radius:20px}
.hero-photo .photo-ph{color:rgba(255,255,255,.7);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3);border-radius:0}
.is-missing .photo-ph{display:flex}
.photo-ph svg{opacity:.6}
.ph-file{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;opacity:.85;word-break:break-all}

/* ============ DOCK ============ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--charcoal) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.14)}
.dock-in{max-width:var(--wrap);margin:0 auto;padding:6px var(--pad);display:flex;align-items:center;justify-content:center;min-height:var(--dock-h)}
.marks{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px;width:100%;padding:2px}
.mark{display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-size:15px;font-weight:700;color:rgba(255,255,255,.8);
  background:none;border:0;cursor:pointer;padding:8px 14px;border-radius:12px;min-height:44px;white-space:nowrap;
  transition:color .2s,background .2s;text-decoration:none}
.mark svg{width:20px;height:20px;color:var(--acc-p,#fff);flex:none}
.mark:hover{color:#fff;background:rgba(255,255,255,.1)}
@media (max-width:759px){
  .marks{gap:4px}
  .mark{flex:1 1 30%;max-width:33.33%;flex-direction:column;gap:5px;font-size:12px;font-weight:600;
    padding:8px 4px;min-height:58px;white-space:normal;text-align:center;line-height:1.15}
  .mark svg{width:18px;height:18px}
}

/* ============ КАРТОЧКИ ============ */
.two-col{display:grid;gap:16px;max-width:1120px;margin-inline:auto}
@media (min-width:900px){.two-col{grid-template-columns:1fr 1fr}}
.tcard{padding:clamp(20px,2.4vw,30px);border-radius:20px;background:var(--surface);border:1px solid var(--line);

.tcard:hover{transform:translateY(-3px)}
.t-head{display:flex;align-items:center;gap:14px;width:100%}
.tcard .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--acc-p,var(--accent)) 15%,transparent);color:var(--acc-p,var(--accent))}
.tcard .ai svg{width:24px;height:24px}
.tcard p{color:var(--muted);font-size:15.5px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}

.cards{display:grid;gap:14px;grid-template-columns:1fr}

.sph-body{flex:1 1 320px;min-width:0;display:grid;gap:8px;align-content:start}
.sph-body h3{font-size:20px}
.sph-owners{color:var(--muted);font-size:14px;font-weight:600}
.sph-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.sph-list li{position:relative;padding-left:18px;color:var(--muted);font-size:14.5px;line-height:1.45}

@media (min-width:900px){

}
.p-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:980px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.p-badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.p-badge svg{width:14px;height:14px}
.sph-side .btn{min-height:44px;padding:10px 22px;font-size:15px}

/* ============ СЕРВИСЫ ============ */
.sv-grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.sv-grid{grid-template-columns:repeat(2,1fr)}}

  display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s;text-decoration:none;color:inherit}
.scard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--acc-p) 55%,transparent)}
.scard .si{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--acc-p) 14%,transparent);color:var(--acc-p)}

.scard:hover .go svg{transform:translateX(3px)}

<script>
"use strict";
/* ============================================================================
   ШПАРГАЛКА ПО ФАЙЛАМ — что загрузить в папку images/
   ----------------------------------------------------------------------------
   logo-white.png    логотип БЕЛЫЙ (без фона и рамки) → шапка (nav) и футер (крупно)
   logo-color.png    логотип ЦВЕТНОЙ → резерв (печатные материалы, презентации)
   logo-black.png    логотип ЧЁРНЫЙ  → резерв (документы)
   hero-school-white.png  графика школы белыми линиями, 1536×1024 (3:2) → hero: справа снизу, заходит под текст
   prod-01.png … prod-06.png  скриншоты продуктов ТПГ → блок «Продукты ТПГ»
   ----------------------------------------------------------------------------
   Пока файла нет — сайт покажет аккуратную заглушку с именем файла и НЕ сломается.
============================================================================ */

/* ================= КОНСТАНТЫ ================= */
const ME = "mmmaslikov";
const IMG = "images/";
const LS_THEME = "tai_site_theme_v1";
const SCHOOL_SITE = "https://иркутск.точкабудущего.рф/";
const HERO_IMG = ["hero-school-white.png", "Графика школы «Точка будущего» белыми линиями"];

/* ================= STATE ================= */
const state = { menu:false, theme:"auto" };
const missingFiles = new Set();

/* ================= УТИЛИТЫ ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function bindImages(root){
  $$("img[data-file]", root).forEach(img=>{
    const f = img.dataset.file;
    const frame = img.closest(".hero-photo, .gal-photo");
    if (missingFiles.has(f)){ frame?.classList.add("is-missing"); return; }
    img.addEventListener("error", ()=>{ missingFiles.add(f); frame?.classList.add("is-missing"); });
    img.addEventListener("load", ()=>frame?.classList.add("is-loaded"));
    if (img.complete && img.naturalWidth>0) frame?.classList.add("is-loaded");
  });
  $$("img[data-logo]", root).forEach(img=>{
    const f = img.dataset.logo;
    const hide = ()=>img.classList.add("hide");
    if (missingFiles.has(f)){ hide(); return; }
    img.addEventListener("error", ()=>{ missingFiles.add(f); hide(); });
  });
}

        <article class="tcard" style="--acc-p:#0a84ff"><div class="t-head"><span class="ai">${ICONS.layers}</span><h3>Зачем этот сайт</h3></div><p class="j">Убрать разрыв между интересом к нейросетям и их реальной пользой: вместо стихийных экспериментов — единое место с проверенными инструментами, алгоритмами и примерами применения в каждой сфере комплекса.</p></article>
        <article class="tcard" style="--acc-p:#30d158"><div class="t-head"><span class="ai">${ICONS.team}</span><h3>Для кого</h3></div><p class="j">Для всех сотрудников: учителей-предметников, психологов и тьюторов, педагогов-организаторов, сотрудников Буклаба, специалистов инклюзивного сопровождения и руководителей. У каждой сферы — своя страница со своими кейсами.</p></article>
        <article class="tcard" style="--acc-p:#ff9f0a"><div class="t-head"><span class="ai">${ICONS.check}</span><h3>Проверенные кейсы</h3></div><p class="j">В основе контента — реальная работа: кейсы, промпты и инструкции проверяются сотрудниками на уроках, совещаниях и мероприятиях, а затем публикуются, чтобы коллеги могли переиспользовать готовые решения.</p></article>
        <article class="tcard" style="--acc-p:#bf5af2"><div class="t-head"><span class="ai">${ICONS.spark}</span><h3>Кто поддерживает</h3></div><p class="j">Сайт создаёт и развивает ТПГ «ГенИИ» — творческая проектировочная группа под руководством Масликова Михаила Михайловича. Страницы сфер наполняют участники: сайт развивается вместе с командой.</p></article>
      </div>
      <div class="chip-row rv">
        <span class="chip">11 сфер комплекса</span><span class="chip">8 проверенных сервисов</span>
        <span class="chip">50+ продуктов за год</span><span class="chip">2026/2027 учебный год</span>

    <section class="sec sec--m2" id="spheres"><div class="wrap">
      <div class="sec-head center rv"><span class="sec-kicker">Сферы</span><h2>Страницы объединений и служб</h2>
      <p class="sec-lead">Каждая сфера ведёт свою страницу: инструменты, промпты, инструкции и готовые продукты. Страницы публикуют сами участники ТПГ.</p></div>

    <section class="sec" id="safety"><div class="wrap">
      <div class="sec-head center rv"><span class="sec-kicker">Безопасность</span><h2>Этика и персональные данные</h2>
      <p class="sec-lead">Шесть правил, которые обязательны для всех сотрудников при работе с ИИ. Основа — Федеральный закон № 152-ФЗ «О персональных данных».</p></div>
      <div class="two-col rv" id="safety-grid"></div>
      <div class="note rv">Подробная памятка по работе с персональными данными готовится ТПГ «ГенИИ» и будет опубликована здесь отдельным документом. До её выхода действуют шесть правил выше.</div>
    </div></section>

    <section class="sec sec--m2" id="services"><div class="wrap">
      <div class="sec-head center rv"><span class="sec-kicker">Сервисы</span><h2>Что доступно в школе</h2>
      <p class="sec-lead">Проверенный набор сервисов: генерация текстов и кода, презентации, изображения, публикация сайтов и база знаний.</p></div>
      <div class="sv-grid rv" id="sv-grid"></div>

    <section class="sec" id="products"><div class="wrap">
      <div class="sec-head center rv"><span class="sec-kicker">Продукты</span><h2>Уже сделано в ТПГ</h2>
      <p class="sec-lead">Рабочие продукты, созданные по конвейеру «тема → промпт → код → публикация». Скриншоты и подписи обновляются по мере выхода новых версий.</p></div>
      <div class="gal-grid rv" id="gal"></div>

  </main>

  <footer class="footer" id="contacts"><div class="wrap footer-in">
    <span class="f-logo"><img data-logo="${LOGO}" src="${IMG}${LOGO}" alt="Логотип Точка ИИ"></span>
    <div class="f-title">Предложить материал или задать вопрос</div>
    <div class="f-contacts">
      <div class="crow">
        <a class="crow-a" href="mailto:${ME}@gmail.com">
          <span class="ci">${ICONS.mail}</span>
          <span class="ct"><small>Email для связи</small><b>${ME}@gmail.com</b></span>
        </a>
        <button class="copy-mini" id="copy-mail" type="button" aria-label="Скопировать email">${ICONS.copy}</button>
      </div>
      <div class="crow">
        <a class="crow-a" href="https://mmmaslikov.github.io/" target="_blank" rel="noopener">
          <span class="ci">${ICONS.dev}</span>
          <span class="ct"><small>Сайт куратора</small><b>mmmaslikov.github.io</b></span>
          <span class="cext">${ICONS.ext}</span>
        </a>
      </div>
      <div class="crow">
        <a class="crow-a" href="https://mmmaslikov.github.io/tpg/" target="_blank" rel="noopener">
          <span class="ci">${ICONS.team}</span>
          <span class="ct"><small>Паспорт ТПГ</small><b>mmmaslikov.github.io/tpg</b></span>
          <span class="cext">${ICONS.ext}</span>
        </a>
      </div>
    </div>
    <p class="f-copy">© 2026 Точка ИИ · ТПГ «ГенИИ»<br>ЧОУ «Точка будущего»</p>
  </div></footer>

  <div class="dock" role="navigation" aria-label="Быстрый доступ">
    <div class="dock-in"><div class="marks" id="marks"></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  renderMarks(); renderCards(); renderSafety(); renderServices(); renderGallery();
  bindImages(document);
}

function renderMarks(){
  $("#marks").innerHTML = MARKS.map(([href,label,icon,color,ext])=>{
    const tag = ext ? "a" : "button";
    const attrs = ext ? `href="${href}" target="_blank" rel="noopener"` : `type="button" data-goto="${href}"`;
    return `<${tag} class="mark" style="--acc-p:${color}" ${attrs}>${ICONS[icon]}${esc(label)}</${tag}>`;
  }).join("");
}
function renderCards(){
  $("#cards").innerHTML = SPHERES.map(s=>{
    const ready = !!s.url;
    const badge = ready
      ? `<span class="p-badge ok">${ICONS.check} страница готова</span>`
      : `<span class="p-badge">${ICONS.lock} в разработке</span>`;
    const cta = ready
      ? `<a class="btn secondary" href="${esc(s.url)}" target="_blank" rel="noopener">Перейти на страницу</a>`
      : `<button class="btn ghost" type="button" data-soon="${esc(s.title)}">Страница скоро появится</button>`;
    return `
    <article class="card sph-row rv" style="--acc-p:${s.color}">
      <span class="sph-ico">${ICONS[s.icon]}</span>
      <div class="sph-body">
        <h3>${esc(s.title)}</h3>
        <div class="sph-owners">${esc(s.owners)}</div>
        <ul class="sph-list">${s.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
      </div>
      <div class="sph-side">${badge}${cta}</div>
    </article>`;
  }).join("");
}
function renderSafety(){
  $("#safety-grid").innerHTML = SAFETY.map(s=>`
    <article class="tcard" style="--acc-p:${s.color}">
      <div class="t-head"><span class="ai">${ICONS[s.icon]}</span><h3>${esc(s.title)}</h3></div>
      <p>${esc(s.text)}</p>
    </article>`).join("");
}
function renderServices(){
  $("#sv-grid").innerHTML = SERVICES.map(s=>`
    <a class="scard" style="--acc-p:${s.color}" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="si">${ICONS[s.icon]}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.desc)}</p>
      <span class="chip" style="align-self:flex-start">${esc(s.chip)}</span>
      <span class="go">Открыть сервис ${ICONS.ext}</span>
    </a>`).join("");
}
function renderGallery(){
  $("#gal").innerHTML = PRODUCTS.map(([file,cap])=>`
    <figure class="gal-card">
      <div class="gal-photo">
        <img data-file="${file}" src="${IMG}${file}" alt="${esc(cap)}" loading="lazy" decoding="async">
        <div class="photo-ph" aria-hidden="true">${ICONS.cam}<span class="ph-file">${IMG}${file}</span></div>
      </div>
      <figcaption class="gal-cap">${esc(cap)}</figcaption>
    </figure>`).join("");
}

/* ================= ТЕМА ================= */
function resolvedTheme(){ return state.theme==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : state.theme; }
function applyTheme(){ document.documentElement.dataset.theme = resolvedTheme();
  $("#theme-btn").innerHTML = resolvedTheme()==="dark" ? ICONS.sun : ICONS.moon;
  $("#theme-btn").setAttribute("aria-label", resolvedTheme()==="dark"?"Светлая тема":"Тёмная тема"); }
function toggleTheme(){ state.theme = resolvedTheme()==="dark" ? "light" : "dark";
  try{ localStorage.setItem(LS_THEME, state.theme); }catch(e){} applyTheme(); }

/* ================= SPY / REVEAL ================= */
function initSpy(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if (en.isIntersecting){ $$(".nav-links a").forEach(a=>a.classList.toggle("active", a.dataset.spy===en.target.id)); }
  }), {rootMargin:"-40% 0px -55% 0px"});
  ["about","spheres","safety","services","products","contacts"].forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}
function initReveal(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});
  $$(".rv").forEach(el=>io.observe(el));
}

/* ================= HANDLERS ================= */
function bindHandlers(){
  $("#theme-btn").addEventListener("click", toggleTheme);
  $("#burger").addEventListener("click", ()=>{ state.menu=!state.menu; $("#menu").classList.toggle("open",state.menu); $("#burger").setAttribute("aria-expanded",String(state.menu)); document.body.classList.toggle("lock",state.menu); });
  $$("#menu a").forEach(a=>a.addEventListener("click", ()=>{ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); document.body.classList.remove("lock"); }));
  document.addEventListener("click", e=>{
    const go = e.target.closest("[data-goto]");
    if (go){ const t=document.querySelector(go.dataset.goto); t?.scrollIntoView({behavior:"smooth"}); return; }
    const soon = e.target.closest("[data-soon]");
    if (soon){ toast("Страница сферы «"+soon.dataset.soon+"» готовится: участник ТПГ опубликует её и пришлёт ссылку."); }
  });
  $("#copy-mail").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(ME+"@gmail.com"); toast("Email скопирован"); }
    catch(e){ toast("Email: "+ME+"@gmail.com"); }
  });
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape" && state.menu){ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); document.body.classList.remove("lock"); }
  });
}

/* ================= INIT ================= */
function init(){
  try{ const t = localStorage.getItem(LS_THEME); if (t==="light"||t==="dark") state.theme = t; }catch(e){}
  renderApp();
  bindHandlers();
  applyTheme();
  initSpy(); initReveal();
}
init();
</script>
